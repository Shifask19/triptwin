server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — resolves backend at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host "backend";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml application/json;

    # Cache static assets aggressively (hashed filenames = safe to cache forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Proxy ALL /api/ calls to backend — resolved at request time
    location /api/ {
        proxy_pass         http://$backend_host:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;

        # Don't buffer — stream responses directly
        proxy_buffering off;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_error;
    }

    # Friendly error when backend is temporarily down
    location @backend_error {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable. Please try again in a moment."}';
    }

    # React SPA — all non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
