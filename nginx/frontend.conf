server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker/Railway internal DNS — resolves at request time
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml application/json;

    # Cache static assets (hashed filenames = safe forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # API proxy — works for both Docker (backend:4000) and Railway (env var)
    location /api/ {
        set $backend_url "http://backend:4000";
        proxy_pass         $backend_url;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # React SPA — all non-file routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
