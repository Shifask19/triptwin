# Railway backend service configuration
# Healthcheck disabled — Railway checks process health instead
# Set environment variables BEFORE first deploy:
#   DATABASE_URL, REDIS_URL, JWT_SECRET, CORS_ORIGINS

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/cluster.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
