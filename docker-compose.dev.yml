# Development compose — hot-reload backend, Vite frontend on host
# Usage: docker-compose -f docker-compose.dev.yml -p triptwin-dev up

name: triptwin-dev

services:

  postgres:
    image: postgres:16-alpine
    container_name: triptwin_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       triptwin
      POSTGRES_USER:     triptwin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triptwin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: triptwin_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
